<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navo Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <style>
        :root {
            --brand: #6f42c1;
            --brand-dark: #59359c;
            --accent: #ffb703;
            --soft: #f7f4ff;
            --dark: #171426;
        }

        body {
            color: var(--dark);
        }

        .text-brand {
            color: var(--brand);
        }

        .btn-brand {
            background-color: var(--brand);
            color: white;
            border-color: var(--brand);
        }

        .btn-brand:hover {
            background-color: var(--brand-dark);
            color: white;
            border-color: var(--brand);
        }

        .hero {
            background: linear-gradient(333deg, var(--brand-dark), var(--brand));
        }

        .bg-soft {
            background-color: var(--soft);
        }

        .product-img {
            height: 220px;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <!-- start navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
        <div class="container">
            <a href="" class="navbar-brand fw-bold text-brand"><i class="bi bi-bag-heart-fill ms-2"></i>Navo Store</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle-navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="#">الرئيسية</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">المنتجات</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">العروض</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">تواصل معنا</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="#">من نحن</a></li>
                </ul>
                <div>
                    <button class="btn btn-light position-relative">
                        <i class="bi bi-heart"></i>
                    </button>
                    <button class="btn btn-light btn-brand position-relative">
                        <i class="bi bi-cart3"></i>
                        <span
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">3</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>
    <!-- end navbar -->
</body>

</html>
